apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  params:
    - name: WORKSPACE_SOURCE_PATH
      type: string
      default: "."
  steps:
    - name: remove
      image: alpine:3
      script: |
        #!/usr/bin/env sh
        set -e
        echo "Cleaning workspace..."
        rm -rf $(workspaces.source.path)/$(params.WORKSPACE_SOURCE_PATH)/*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npminstall
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:20-buster-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        echo "***** Environment *****"
        npm --version
        pwd
        echo "***** Cleaning npm cache *****"
        npm cache clean --force
        echo "***** Running npm install *****"
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: node:20-buster-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        echo "***** Running jasminetests *****"
        npx jasmine
